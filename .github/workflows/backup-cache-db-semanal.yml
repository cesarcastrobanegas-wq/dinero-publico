name: Copia semanal de cache.db (repositorio privado aparte)

# Diseño (2026-10-11): la copia de la base de producción YA NO se guarda en este repositorio, que es público (hasta
# esa fecha vivía en la rama `cache-db-backup` y cualquiera podía descargarla, con los DNI/NIE de los autónomos). Este
# flujo se ejecuta aquí, donde los minutos de Actions son gratuitos, pero sube la copia, comprimida, como fichero
# adjunto de una «release» del repositorio PRIVADO `dinero-publico-copias`, y conserva solo las dos últimas.
#
# Secretos: ADMIN_TOKEN (solo para leer GET /admin/cache-db), COPIAS_TOKEN (token limitado de César con permiso
# «Contents: Read and write» únicamente sobre el repositorio privado) y ALERTAS_COPIA_CLAVE (la MISMA clave de cifrado
# que las copias de alertas.db y socios.db). Sin COPIAS_TOKEN o sin la clave el flujo no hace nada.
# No se sube ningún artefacto ni se imprime contenido de la base: solo tamaños y recuentos.
#
# 2026-11-03: la copia va CIFRADA (gpg simétrico AES-256, mismos parámetros que copia-alertas-cifrada.yml): antes se
# subía solo comprimida (cache_*.db.gz) y quien tuviera acceso al repositorio privado podía leer los DNI/NIE. Ahora
# es cache_AAAA-MM-DD_HHMM.db.gz.gpg (gzip y después gpg, sin compresión de gpg encima). Las copias antiguas sin
# cifrar (*.db.gz) se borran solas cuando ya hay dos copias cifradas en la release.
#
# Para restaurar una copia (en un ordenador de confianza):
#   python backend/descifrar_copia_cache.py cache_AAAA-MM-DD_HHMM.db.gz.gpg      (pide la clave y deja cache.db)

on:
  schedule:
    - cron: "0 4 * * 1"  # lunes 04:00 UTC
  workflow_dispatch:
    inputs:
      conservar_todas:
        description: "Prueba: no borrar ninguna copia antigua (por defecto se dejan solo las dos últimas)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  copia-cache-db:
    runs-on: ubuntu-latest
    env:
      DESTINO: ${{ github.repository_owner }}/dinero-publico-copias
      ETIQUETA: copia-semanal
    steps:
      - name: ¿Están el token del repositorio privado y la clave de cifrado?
        id: token
        env:
          COPIAS_TOKEN: ${{ secrets.COPIAS_TOKEN }}
          ALERTAS_COPIA_CLAVE: ${{ secrets.ALERTAS_COPIA_CLAVE }}
        run: |
          if [ -z "$COPIAS_TOKEN" ] || [ -z "$ALERTAS_COPIA_CLAVE" ]; then
            echo "::warning::Falta COPIAS_TOKEN o ALERTAS_COPIA_CLAVE: no se hace la copia (nunca se sube sin cifrar)."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          elif [ "${#ALERTAS_COPIA_CLAVE}" -lt 20 ]; then
            echo "::error::ALERTAS_COPIA_CLAVE tiene menos de 20 caracteres: demasiado corta para cifrar con ella."
            exit 1
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar cache.db actual de producción
        if: steps.token.outputs.hay == 'si'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          ok=0
          for intento in 1 2 3 4 5; do
            codigo=$(curl -sS --max-time 900 -o cache.db -w "%{http_code}" \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" "https://dinero-publico.com/admin/cache-db" || echo 000)
            tam=$(stat -c%s cache.db 2>/dev/null || echo 0)
            echo "Intento ${intento}: HTTP ${codigo}, ${tam} bytes"
            if [ "$codigo" = "200" ] && [ "$tam" -ge 1000000 ]; then
              ok=1
              break
            fi
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "::error::No se consiguió un cache.db válido: no se toca la copia existente."
            exit 1
          fi

      - name: Comprobación de integridad
        if: steps.token.outputs.hay == 'si'
        run: |
          resultado=$(python3 -c "import sqlite3; print(sqlite3.connect('cache.db').execute('PRAGMA integrity_check').fetchone()[0])")
          if [ "$resultado" != "ok" ]; then
            echo "::error::cache.db no pasa PRAGMA integrity_check: no se toca la copia existente."
            exit 1
          fi
          echo "integrity_check: ok -- $(python3 -c "import sqlite3; print(sqlite3.connect('cache.db').execute('SELECT COUNT(*) FROM municipios').fetchone()[0])") fichas"

      - name: Comprimir y cifrar
        if: steps.token.outputs.hay == 'si'
        env:
          ALERTAS_COPIA_CLAVE: ${{ secrets.ALERTAS_COPIA_CLAVE }}
        run: |
          set -euo pipefail
          umask 077
          # 2026-10-17: con la hora (de Madrid) en el nombre, para que dos copias del mismo día no se pisen. Ordena bien
          # entre sí con LC_ALL=C sort.
          nombre="cache_$(TZ=Europe/Madrid date +%Y-%m-%d_%H%M).db.gz.gpg"
          # gzip por tubería: el .gz sin cifrar nunca llega al disco. --compress-algo none porque ya va comprimido.
          gzip -6 -c cache.db | gpg --batch --yes --no-symkey-cache --pinentry-mode loopback \
            --passphrase-fd 3 3< <(printf '%s' "$ALERTAS_COPIA_CLAVE") \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 --compress-algo none \
            --output "$nombre"
          original=$(stat -c%s cache.db)
          shred -u cache.db
          # Comprobación: con la clave se descifra entero, el gzip está sano (gzip -dc falla si no) y dentro hay una base
          # SQLite. Python lee hasta el final para no cortar la tubería (con pipefail, un head cortaría gpg y gzip).
          printf '%s' "$ALERTAS_COPIA_CLAVE" | gpg --batch --quiet --no-symkey-cache --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt "$nombre" | gzip -dc | python3 -c "
          import sys
          f = sys.stdin.buffer
          ok = f.read(16).startswith(b'SQLite format 3')
          while f.read(1 << 20):
              pass
          sys.exit(0 if ok else 1)"
          # ...con una clave equivocada no se abre, y el fichero no empieza como gzip ni como SQLite.
          if printf 'clave-equivocada' | gpg --batch --quiet --no-symkey-cache --pinentry-mode loopback --passphrase-fd 0 --decrypt "$nombre" > /dev/null 2>&1; then
            echo "::error::La copia se abre con una clave equivocada."; exit 1
          fi
          if ! python3 -c "import sys; c = open(sys.argv[1], 'rb').read(16); sys.exit(1 if c[:2] == b'\x1f\x8b' or c.startswith(b'SQLite') else 0)" "$nombre"; then
            echo "::error::La copia no está cifrada."; exit 1
          fi
          sha256sum "$nombre" > "${nombre}.sha256"
          echo "nombre=${nombre}" >> "$GITHUB_ENV"
          echo "Copia cifrada: ${nombre}, $(stat -c%s "$nombre") bytes (original ${original})"

      - name: Subir al repositorio privado y dejar solo las dos últimas
        if: steps.token.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ secrets.COPIAS_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$ETIQUETA" --repo "$DESTINO" > /dev/null 2>&1; then
            gh release create "$ETIQUETA" --repo "$DESTINO" --title "Copia semanal de cache.db" \
              --notes "Copias automáticas de la base de producción, cifradas con gpg (AES-256). Se conservan las dos últimas."
          fi
          gh release upload "$ETIQUETA" "$nombre" "${nombre}.sha256" --repo "$DESTINO" --clobber
          activos=$(gh release view "$ETIQUETA" --repo "$DESTINO" --json assets --jq '.assets[].name')
          if [ "${{ inputs.conservar_todas }}" = "true" ]; then
            echo "conservar_todas: no se borra ninguna copia antigua"
            printf '%s\n' "$activos" | grep -E '\.db\.gz(\.gpg)?$' | LC_ALL=C sort -r || true
            rm -f "$nombre" "${nombre}.sha256"
            exit 0
          fi
          borrar() {
            gh release delete-asset "$ETIQUETA" "$1" --repo "$DESTINO" --yes
            gh release delete-asset "$ETIQUETA" "${1}.sha256" --repo "$DESTINO" --yes || true
            echo "Borrada la copia antigua $1"
          }
          # conservar las dos copias cifradas más recientes (cada una con su .sha256)
          cifradas=$(printf '%s\n' "$activos" | grep '\.db\.gz\.gpg$' | LC_ALL=C sort -r || true)
          printf '%s\n' "$cifradas" | tail -n +3 | while read -r viejo; do if [ -n "$viejo" ]; then borrar "$viejo"; fi; done
          # las antiguas SIN cifrar (*.db.gz) se borran solo cuando ya hay dos cifradas: nunca se queda sin copia
          if [ "$(printf '%s\n' "$cifradas" | grep -c . || true)" -ge 2 ]; then
            sin_cifrar=$(printf '%s\n' "$activos" | grep '\.db\.gz$' || true)
            printf '%s\n' "$sin_cifrar" | while read -r viejo; do if [ -n "$viejo" ]; then borrar "$viejo"; fi; done
          else
            echo "Aún no hay dos copias cifradas: se conservan las antiguas sin cifrar."
          fi
          rm -f "$nombre" "${nombre}.sha256"
