# TEMPORAL (13-11-2026): diagnóstico de por qué «Refrescar deuda viva» no conecta con www.hacienda.gob.es desde Actions
# (tiempo de conexión agotado cada noche desde el 07-11; desde el PC responde en ~6 s). Solo lecturas públicas; no sube
# nada. Se ejecuta al hacer push a esta rama y se borra antes de proponer la fusión.
name: Hacienda diagnóstico (temporal)
on:
  push:
    branches: [wip/nocturno-deuda-poblacion]
    paths: [.github/workflows/hacienda-diagnostico.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Peticiones
        run: |
          echo "IP de salida: $(curl -s --max-time 20 https://api.ipify.org)"
          echo "DNS: $(getent hosts www.hacienda.gob.es || true)"
          for u in "https://www.hacienda.gob.es/" \
                   "https://www.hacienda.gob.es/es-ES/CDI/Paginas/SistemasFinanciacionDeuda/InformacionEELLs/DeudaViva.aspx" \
                   "https://www.hacienda.gob.es/cdi/sist%20financiacion%20y%20deuda/informacioneells/2025/deuda-viva-ayuntamientos-202512.xlsx" \
                   "https://www.boe.es/" "https://www.ine.es/" "https://contrataciondelestado.es/"; do
            echo "=== $u -> $(curl -s -o /dev/null -w '%{http_code} %{size_download}B conexión %{time_connect}s total %{time_total}s' -A 'dinero-publico.com (diagnostico)' --connect-timeout 45 --max-time 90 "$u" || echo 'sin respuesta')"
          done
          echo "=== IPv4 forzado: $(curl -4 -s -o /dev/null -w '%{http_code} %{time_connect}s' --connect-timeout 45 https://www.hacienda.gob.es/ || echo 'sin respuesta')"
          echo "=== IPv6 forzado: $(curl -6 -s -o /dev/null -w '%{http_code} %{time_connect}s' --connect-timeout 45 https://www.hacienda.gob.es/ || echo 'sin respuesta')"
