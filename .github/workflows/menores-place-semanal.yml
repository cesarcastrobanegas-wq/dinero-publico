# Registro de contratos menores de la Plataforma de Contratación: refresco semanal (2026-10-06, decisión de César).
#
# Es la mayor fuente de contratos menores de la web (unos 850.000) y hasta ahora se regeneraba a mano. Cada ZIP
# mensual de la Plataforma trae los contratos actualizados ese mes, de cualquier fecha, y el reparto por municipios
# se aprende del conjunto entero: cada ejecución necesita TODOS los ZIP desde 09/2021 (1,3 GB). Para no bajarlos
# cada semana de un servidor lento, se guardan en la caché de Actions; solo se vuelven a bajar el mes en curso y el
# anterior. La primera ejecución sí los baja todos (puede tardar más de una hora).
#
# backend/flujo_menores_place.py descarga, genera y deja solo los ficheros mensuales que cambian de verdad; si el
# resultado es sospechoso (menos contratos que antes) no toca nada y avisa.
#
# Guardar en main reinicia la web (Render): por eso va por la tarde y, antes de guardar, espera a que no haya un
# refresco nocturno en marcha. Va en jueves para no coincidir con el flujo de las fuentes propias (domingos).
name: Contratos menores de la Plataforma (semanal)

on:
  schedule:
    - cron: "0 15 * * 4"       # jueves 15:00 UTC
  workflow_dispatch:
    inputs:
      guardar:
        description: Guardar en main los ficheros que cambien (desmarcar para solo probar y ver el resumen).
        type: boolean
        default: true

permissions:
  contents: write
  actions: write           # ver si el refresco nocturno está en marcha y borrar las copias viejas de la caché de ZIP

concurrency:
  group: menores-place-semanal
  cancel-in-progress: false

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: ZIP mensuales ya descargados (caché)
        uses: actions/cache/restore@v4
        with:
          path: ~/place_menores_zips
          key: place-menores-zips-${{ github.run_id }}
          restore-keys: place-menores-zips-

      - name: Descargar lo que falte, generar y comparar
        id: generar
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python backend/flujo_menores_place.py --zips "$HOME/place_menores_zips"
          git status --short | head -80

      # always(): si la generación falla, las descargas ya hechas no se pierden.
      - name: Guardar los ZIP en la caché
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/place_menores_zips
          key: place-menores-zips-${{ github.run_id }}

      - name: Borrar las copias anteriores de la caché de ZIP (1,3 GB cada una)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ESTA: place-menores-zips-${{ github.run_id }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key place-menores-zips- --limit 100 --json key,id \
            --jq ".[] | select(.key != \"$ESTA\") | .id" | while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" && echo "borrada la copia $id" || true
            done || true

      - name: Guardar en main los ficheros que han cambiado
        if: steps.generar.outputs.cambios != '' && steps.generar.outputs.cambios != '0' && (github.event_name == 'schedule' || github.event.inputs.guardar == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          CAMBIOS: ${{ steps.generar.outputs.cambios }}
        run: |
          set -uo pipefail
          # No guardar mientras el refresco nocturno esté en marcha (el reinicio de la web le mataría el trabajo).
          fin=$(( $(date +%s) + 3 * 3600 ))
          while true; do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow actualizar-diario.yml --limit 20 \
                  --json status --jq '[.[] | select(.status != "completed")] | length' || echo "?")
            if [ "$n" = "0" ]; then break; fi
            if [ "$(date +%s)" -ge "$fin" ]; then
              echo "::error::El refresco nocturno sigue en marcha tras 3 h de espera (o no se pudo consultar: '$n'). No se guarda nada esta semana."
              exit 1
            fi
            echo "Refresco nocturno en marcha ($n): se espera 5 min antes de guardar..."
            sleep 300
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/contratos_menores_place_*.json.gz
          if git diff --cached --quiet; then
            echo "Nada que guardar."
            exit 0
          fi
          git commit -q -m "Auto-commit: registro de contratos menores de la Plataforma (${CAMBIOS} meses con cambios)"
          for intento in 1 2 3 4 5; do
            if git push -q; then
              echo "Guardado en main. Render reiniciará la web en unos minutos."
              exit 0
            fi
            echo "push rechazado -- reintento ${intento}/5 tras traer main..."
            git pull -q --rebase || { echo "::error::No se pudo traer main."; exit 1; }
            sleep 10
          done
          echo "::error::git push falló tras 5 intentos."
          exit 1

      - name: Aviso si hubo problemas
        if: always() && steps.generar.outputs.problemas != '0'
        run: |
          echo "::error::El registro de menores de la Plataforma no se pudo refrescar (o el resultado era sospechoso). Se conservan los ficheros anteriores; detalle en el resumen de la ejecución."
          exit 1
