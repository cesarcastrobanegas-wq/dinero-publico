name: Administradores del BORME (diario)

# Decisiones de César (2026-10-04, §7 de INFORME_ADMINISTRADORES_BORME.md):
#  - el fichero con los nombres (administradores_borme.json) vive SOLO en el disco persistente de Render, nunca en el
#    repositorio: el canal de rectificación no serviría si los nombres quedaran para siempre en el historial público;
#  - descarga incremental diaria del BORME.
#
# Por qué aquí y no dentro de Render: regenerar el fichero recorre un índice de ~2 GB con 3,3 millones de anuncios y
# necesita ~3,8 GB de memoria (medido el 2026-10-04); el servidor de Render tiene 2 GB en total.
#
# Pasos: índice del BORME (caché de Actions, no es un artefacto público) -> días nuevos desde los datos abiertos del
# BOE -> base de producción por la descarga reanudable /admin/cache-db -> regenerar el fichero -> subirlo a
# POST /admin/administradores-borme, que lo guarda en el disco de Render y lo recarga sin reiniciar.
#
# PRIVACIDAD: el repositorio es público y los registros de Actions también. Ningún paso imprime nombres (los scripts
# solo cuentan) y no se publica ningún artefacto. Si se cambia algo aquí, mantenerlo así.

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 09:30 UTC, días laborables: el BORME sale a primera hora
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: administradores-borme
  cancel-in-progress: false

jobs:
  administradores-borme:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # la primera vez (sin índice en caché) descarga 2021-hoy: varias horas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests

      - name: Índice del BORME (caché)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: backend/borme_actos.db
          key: borme-actos-${{ github.run_id }}
          restore-keys: borme-actos-

      - name: Descargar los días nuevos del BORME
        run: |
          cd backend
          if [ -f borme_actos.db ]; then
            hasta=$(python -c "import sqlite3; f=sqlite3.connect('borme_actos.db').execute('SELECT max(fecha) FROM dias').fetchone()[0]; import datetime as d; print(d.date(int(f[:4]),int(f[4:6]),int(f[6:]))-d.timedelta(days=7))")
          else
            echo "Sin índice en caché: descarga completa desde 2021 (varias horas)."
            hasta=2021-01-01
          fi
          echo "Descargando de $(date -u +%F) hacia atrás hasta ${hasta} (los días ya guardados se saltan)"
          python borme_actos.py descargar --desde "$(date -u +%F)" --hasta "${hasta}" | tail -20
          python borme_actos.py estado

      - name: Guardar el índice en la caché
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/borme_actos.db
          key: borme-actos-${{ github.run_id }}

      # 06-11-2026 (ancho de banda de Render): el generador solo necesita los adjudicatarios agregados y la tabla
      # `directores`. La web los da en un resumen de pocos MB (/admin/resumen-administradores, ver
      # resumen_adjudicatarios.py) y la base entera (1.509 MB) solo se baja si la web aún no tiene esa ruta o el
      # resumen no es válido. Así el flujo funciona igual antes y después de desplegar el cambio.
      - name: Resumen de adjudicatarios (pocos MB en vez de la base entera)
        id: resumen
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # 202 = la web lo está preparando (tarda unos minutos): se vuelve a preguntar cada 30 s, como mucho 30 min.
          fin=$(( $(date +%s) + 1800 ))
          while true; do
            codigo=$(curl -sS --max-time 120 -o resumen.json.gz -w '%{http_code}' \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" "https://dinero-publico.com/admin/resumen-administradores" || echo 000)
            [ "$codigo" = "202" ] || break
            if [ "$(date +%s)" -ge "$fin" ]; then echo "::warning::El resumen sigue preparándose tras 30 min."; break; fi
            echo "La web está preparando el resumen ($(head -c 200 resumen.json.gz)); se pregunta otra vez en 30 s"
            sleep 30
          done
          if [ "$codigo" = "200" ] && python backend/resumen_adjudicatarios.py --comprobar resumen.json.gz; then
            echo "Resumen válido: $(stat -c%s resumen.json.gz) bytes. No se baja la base entera."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "Sin resumen (HTTP ${codigo}): se baja la base entera, como antes."
            rm -f resumen.json.gz
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Base de producción (descarga reanudable)
        if: steps.resumen.outputs.hay != 'si'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for i in $(seq 1 15); do
            if curl -sS --fail -C - -o cache.db -H "X-Admin-Token: ${ADMIN_TOKEN}" "https://dinero-publico.com/admin/cache-db"; then
              break
            fi
            echo "Corte en el intento ${i}, reanudando en 15 s..."
            sleep 15
          done
          resultado=$(python -c "import sqlite3; print(sqlite3.connect('cache.db').execute('PRAGMA integrity_check').fetchone()[0])")
          echo "cache.db: $(stat -c%s cache.db) bytes, integrity_check=${resultado}"
          [ "$resultado" = "ok" ] || { echo "::error::cache.db no válido, no se toca nada en producción."; exit 1; }

      # Índice histórico 2009-2020: borme-historico.yml lo descarga una vez y lo deja en la caché; aquí solo se lee.
      # Si no está, el generador sigue con el índice diario, como antes.
      - name: Índice histórico del BORME (caché, solo lectura)
        uses: actions/cache/restore@v4
        with:
          path: backend/borme_actos_historico.db
          key: borme-historico-diario-no-existe
          restore-keys: borme-historico-

      - name: Regenerar el fichero de administradores
        env:
          HAY_RESUMEN: ${{ steps.resumen.outputs.hay }}
        run: |
          if [ "$HAY_RESUMEN" = "si" ]; then
            python backend/administradores_borme.py --resumen resumen.json.gz --salida administradores_borme.json
          else
            python backend/administradores_borme.py --cache cache.db --salida administradores_borme.json
          fi

      - name: Subir a Render (disco persistente)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          gzip -9 -k administradores_borme.json
          # Reintento con límite (2026-10-05): si la web se está reiniciando (cada guardado en main la redespliega),
          # se reintenta ante 502/503/504/sin respuesta durante como mucho 5 minutos; después, fallo de verdad.
          fin=$(( $(date +%s) + 300 ))
          while true; do
            codigo=$(curl -sS -o respuesta.json -w '%{http_code}' --max-time 300 -X POST -H "Content-Type: application/gzip" \
              --data-binary @administradores_borme.json.gz \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" "https://dinero-publico.com/admin/administradores-borme" || echo 000)
            case "$codigo" in
              000|502|503|504|520|521|522|523|524)
                [ "$(date +%s)" -ge "$fin" ] && { echo "::error::La web sigue sin responder (HTTP ${codigo}) tras 5 min."; exit 1; }
                echo "HTTP ${codigo}: ¿la web está reiniciándose? Reintento en 30 s"; sleep 30 ;;
              200) cat respuesta.json; echo; break ;;
              *) echo "::error::Subida rechazada (HTTP ${codigo})"; cat respuesta.json; echo; exit 1 ;;
            esac
          done
          rm -f administradores_borme.json administradores_borme.json.gz cache.db resumen.json.gz
