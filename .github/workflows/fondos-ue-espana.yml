name: Fondos UE de toda España (semanal)

# /fondos-ue con todas las provincias (encargo de César, 2026-10-12). Ver backend/fondos_ue_espana.py.
#  - Descarga Cohesion Data (FEDER/FSE 2014-2020, todas las operaciones con España) y el volcado de CORDIS (Horizon
#    Europe, organizaciones españolas), decide de qué provincia es cada una (o si es regional, estatal o de
#    cooperación entre países) y sube el resultado a Render: POST /admin/fondos-ue, que sustituye la tabla de golpe.
#  - Se hace aquí y no dentro de la web porque el volcado de CORDIS entero en memoria ya tumbó el contenedor en julio.
#  - Con el nombre y el NIF de las organizaciones de CORDIS (--nombres, decisión de César del 13-10), nunca los de
#    quien tiene un NIF con forma de DNI/NIE. Cohesion Data no publica beneficiarios para España; la web conserva los
#    que ya tenía de Murcia y Girona. El fichero no se guarda en el repositorio ni como artefacto; los registros solo
#    muestran recuentos.
#  - La subida está protegida: si llega más de un 20 % por debajo de lo que hay, la web responde 409 y no cambia nada.
#  - 2026-10-17: también FEDER, FSE+ y Transición Justa 2021-2027 de Kohesio (28.000 operaciones; el nombre del
#    beneficiario solo si es claramente una entidad, nunca NIF) y los 100 mayores perceptores del Plan de Recuperación
#    (lista oficial del Gobierno, todos personas jurídicas). Kohesio alarga el flujo hasta una hora.
#  - 2026-10-23 (opción 2 de César): desde el 21-10 Kohesio da 403 a GitHub Actions (al PC de César, no).
#    2026-10-30 (encargo de César): con --una-fuente-opcional, si falla UNA fuente cualquiera (Cohesion Data, CORDIS,
#    Kohesio o los 100 perceptores) el fichero se genera con las demás y se sube con ?conservar=<fuente>: la web se queda
#    con las operaciones de esa fuente de la última carga buena y responde de qué día son. Después de subir lo demás, el
#    flujo sale EN ROJO a propósito (para que llegue el correo de GitHub) con el aviso en el resumen de la ejecución.
#    Si fallan dos o más, falla entero y no se sube nada.
#  - 2026-11-05: diagnosticado: el balanceador de la Comisión (Server: awselb/2.0) responde 403 a TODO
#    kohesio.ec.europa.eu y linkedopendata.eu desde la IP de Actions (portada incluida, con cualquier User-Agent); al PC,
#    200 con las mismas direcciones. No ha cambiado la API. El 403 ya no se reintenta (antes, ~3 min) y el resumen dice
#    cómo cargarlo desde el PC: python backend/subir_fondos_ue_pc.py. Sigue saliendo EN ROJO (decisión de César).
#  - Antes tardaba unos 5 minutos. Miércoles por la tarde: fuera del refresco nocturno (06:35-13:00 UTC reales) y de los flujos
#    de menores (jueves y domingo), que al guardar en main reinician la web.

on:
  schedule:
    - cron: "30 16 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fondos-ue-espana
  cancel-in-progress: false

jobs:
  fondos-ue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests openpyxl

      - name: Generar (Cohesion Data + CORDIS + Kohesio 2021-2027 + 100 perceptores del Plan)
        run: python backend/fondos_ue_espana.py generar --salida fondos_ue.ndjson.gz --nombres --una-fuente-opcional

      - name: Subir a Render
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          KOHESIO_DIAS_MAX: "60"
        run: |
          grave=""
          # Mismo reintento con límite que subvenciones: si la web se está reiniciando, se espera como mucho 5 minutos.
          url="https://dinero-publico.com/admin/fondos-ue"
          falta=""
          if [ -f fondos_ue.ndjson.gz.falta ]; then
            falta=$(head -n 1 fondos_ue.ndjson.gz.falta)   # fuente que no se pudo descargar: la web conserva lo que tenía
            url="${url}?conservar=${falta}"
          fi
          fin=$(( $(date +%s) + 300 ))
          while true; do
            codigo=$(curl -sS -o respuesta.json -w '%{http_code}' --max-time 600 -X POST -H "Content-Type: application/gzip" \
              --data-binary @fondos_ue.ndjson.gz \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" "${url}" || echo 000)
            case "$codigo" in
              000|502|503|504|520|521|522|523|524)
                [ "$(date +%s)" -ge "$fin" ] && { echo "::error::La web sigue sin responder (HTTP ${codigo}) tras 5 min."; exit 1; }
                echo "HTTP ${codigo}: ¿la web está reiniciándose? Reintento en 30 s"; sleep 30 ;;
              200) cat respuesta.json; echo
                   if [ -n "$falta" ]; then
                     aviso=$(python3 -c "import json; k = json.load(open('respuesta.json')).get('conservado') or {}; e = open('fondos_ue.ndjson.gz.falta', encoding='utf-8').read().splitlines()[1:2]; print('%s no se pudo descargar (%s). Subido lo demás; la web conserva %s operaciones de %s de la carga del %s.' % ('$falta', (e or ['?'])[0], k.get('conservadas', 0), '$falta', k.get('de_la_carga_del') or '(no había ninguna)'))")
                     echo "### Fondos UE: falta una fuente" >> "$GITHUB_STEP_SUMMARY"
                     echo "$aviso" >> "$GITHUB_STEP_SUMMARY"
                     if [ "$falta" = "kohesio" ]; then
                       # 05-11: Kohesio bloquea por IP a GitHub Actions (403 de su balanceador); al PC del titular, no.
                       # 26-11 (César): como el bloqueo es permanente, sin Kohesio va en AMARILLO (aviso), no en rojo,
                       # salvo que lo conservado tenga más de KOHESIO_DIAS_MAX días: entonces rojo para acordarse de cargarlo.
                       dias=$(python3 -c "import json, datetime; d = (json.load(open('respuesta.json')).get('conservado') or {}).get('de_la_carga_del') or ''; print((datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None) -datetime.datetime.strptime(d[:10], '%Y-%m-%d')).days if d else 9999)" || echo 9999)
                       if [ "$dias" -gt "${KOHESIO_DIAS_MAX}" ]; then
                         echo "::error::${aviso} Lo conservado tiene ${dias} días (más de ${KOHESIO_DIAS_MAX}): toca cargar Kohesio desde el PC."
                         grave="si"
                       else
                         echo "::warning::${aviso} (${dias} días; se pondrá en rojo a partir de ${KOHESIO_DIAS_MAX})"
                       fi
                       echo "" >> "$GITHUB_STEP_SUMMARY"
                       echo "Para cargar Kohesio, desde el PC: \`python backend/subir_fondos_ue_pc.py\` (pide el token; tarda ~1 h)." >> "$GITHUB_STEP_SUMMARY"
                     else
                       echo "::error::${aviso}"
                       grave="si"
                     fi
                   fi
                   break ;;
              *) echo "::error::Subida rechazada (HTTP ${codigo})"; cat respuesta.json; echo; exit 1 ;;
            esac
          done
          rm -f fondos_ue.ndjson.gz fondos_ue.ndjson.gz.falta
          # Lo demás ya está subido; el rojo es solo para avisar (30-10). Desde el 26-11, sin Kohesio reciente = amarillo.
          if [ -n "$grave" ]; then exit 1; fi
