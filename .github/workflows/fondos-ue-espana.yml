name: Fondos UE de toda España (semanal)

# /fondos-ue con todas las provincias (encargo de César, 2026-10-12). Ver backend/fondos_ue_espana.py.
#  - Descarga Cohesion Data (FEDER/FSE 2014-2020, todas las operaciones con España) y el volcado de CORDIS (Horizon
#    Europe, organizaciones españolas), decide de qué provincia es cada una (o si es regional, estatal o de
#    cooperación entre países) y sube el resultado a Render: POST /admin/fondos-ue, que sustituye la tabla de golpe.
#  - Se hace aquí y no dentro de la web porque el volcado de CORDIS entero en memoria ya tumbó el contenedor en julio.
#  - Con el nombre y el NIF de las organizaciones de CORDIS (--nombres, decisión de César del 13-10), nunca los de
#    quien tiene un NIF con forma de DNI/NIE. Cohesion Data no publica beneficiarios para España; la web conserva los
#    que ya tenía de Murcia y Girona. El fichero no se guarda en el repositorio ni como artefacto; los registros solo
#    muestran recuentos.
#  - La subida está protegida: si llega más de un 20 % por debajo de lo que hay, la web responde 409 y no cambia nada.
#  - 2026-10-17: también FEDER, FSE+ y Transición Justa 2021-2027 de Kohesio (28.000 operaciones; el nombre del
#    beneficiario solo si es claramente una entidad, nunca NIF) y los 100 mayores perceptores del Plan de Recuperación
#    (lista oficial del Gobierno, todos personas jurídicas). Kohesio alarga el flujo hasta una hora.
#  - 2026-10-23 (opción 2 de César): desde el 21-10 Kohesio da 403 a GitHub Actions. Con --kohesio-opcional, si Kohesio
#    falla se genera el fichero sin Kohesio y se sube con ?conservar=kohesio: la web se queda con las operaciones de
#    Kohesio de la última carga buena (p. ej. la subida desde el PC del 21-10) y responde de qué día son.
#  - Antes tardaba unos 5 minutos. Miércoles por la tarde: fuera del refresco nocturno (06:35-13:00 UTC reales) y de los flujos
#    de menores (jueves y domingo), que al guardar en main reinician la web.

on:
  schedule:
    - cron: "30 16 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fondos-ue-espana
  cancel-in-progress: false

jobs:
  fondos-ue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests openpyxl

      - name: Generar (Cohesion Data + CORDIS + Kohesio 2021-2027 + 100 perceptores del Plan)
        run: python backend/fondos_ue_espana.py generar --salida fondos_ue.ndjson.gz --nombres --kohesio-opcional

      - name: Subir a Render
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Mismo reintento con límite que subvenciones: si la web se está reiniciando, se espera como mucho 5 minutos.
          url="https://dinero-publico.com/admin/fondos-ue"
          if [ -f fondos_ue.ndjson.gz.sin-kohesio ]; then
            url="${url}?conservar=kohesio"          # Kohesio no se pudo descargar: la web conserva lo que tenía
          fi
          fin=$(( $(date +%s) + 300 ))
          while true; do
            codigo=$(curl -sS -o respuesta.json -w '%{http_code}' --max-time 600 -X POST -H "Content-Type: application/gzip" \
              --data-binary @fondos_ue.ndjson.gz \
              -H "X-Admin-Token: ${ADMIN_TOKEN}" "${url}" || echo 000)
            case "$codigo" in
              000|502|503|504|520|521|522|523|524)
                [ "$(date +%s)" -ge "$fin" ] && { echo "::error::La web sigue sin responder (HTTP ${codigo}) tras 5 min."; exit 1; }
                echo "HTTP ${codigo}: ¿la web está reiniciándose? Reintento en 30 s"; sleep 30 ;;
              200) cat respuesta.json; echo
                   if [ -f fondos_ue.ndjson.gz.sin-kohesio ]; then
                     python3 -c "import json; k = json.load(open('respuesta.json')).get('kohesio_conservado') or {}; print('::warning::Kohesio no se pudo descargar: la web conserva %s operaciones de Kohesio de la carga del %s.' % (k.get('conservadas', 0), k.get('de_la_carga_del') or '(no había ninguna)'))"
                   fi
                   break ;;
              *) echo "::error::Subida rechazada (HTTP ${codigo})"; cat respuesta.json; echo; exit 1 ;;
            esac
          done
          rm -f fondos_ue.ndjson.gz fondos_ue.ndjson.gz.sin-kohesio
