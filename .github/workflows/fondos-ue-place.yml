name: Fondos europeos en los contratos de PLACE (a mano)

# Genera backend/fondos_ue_place.json.gz (ver backend/generar_fondos_ue_place.py): qué licitaciones de PLACE declaran
# financiación europea (PRTR = Plan de Recuperación, FEDER, FSE+, FEADER, FEMP, REACT-UE, otros fondos UE). Encargo de
# César del 17-10-2026. Lee los ZIP mensuales de PLACE de uno en uno (unas 3-5 h) y deja el fichero en la rama indicada
# con un commit propio; la web lo aplica al arrancar (_aplicar_fondos_ue_place). No toca producción ni descarga su base.
# El fichero solo lleva identificadores de licitación (idEvl) y códigos de fondo: ningún nombre ni NIF.
# Nunca escribe en main: si se pide main, el flujo se para.

on:
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama donde dejar el fichero (no main)"
        default: "wip/fondos-ue-2021-2027"
      desde:
        description: "Mes más reciente (AAAAMM)"
        default: "202610"
      hasta:
        description: "Mes más antiguo (AAAAMM)"
        default: "202109"

permissions:
  contents: write

concurrency:
  group: fondos-ue-place
  cancel-in-progress: false

jobs:
  fondos:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Nunca en main
        run: |
          if [ "${{ inputs.rama }}" = "main" ]; then echo "::error::Este flujo no escribe en main."; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests

      - name: Leer los ZIP mensuales de PLACE
        run: |
          cd backend
          python generar_fondos_ue_place.py "${{ inputs.desde }}" "${{ inputs.hasta }}" --salida fondos_ue_place.json.gz

      - name: Guardar el fichero en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/fondos_ue_place.json.gz
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Fondos europeos de los contratos de PLACE (${{ inputs.hasta }}-${{ inputs.desde }}) [skip render]"
          git push origin "HEAD:${{ inputs.rama }}"

      # Por si la configuración del repositorio no deja escribir al flujo: el mismo fichero (sin datos personales) como
      # artefacto de 7 días, para bajarlo y subirlo a mano.
      - name: Fichero como artefacto (respaldo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fondos-ue-place
          path: backend/fondos_ue_place.json.gz
          if-no-files-found: warn
          retention-days: 7
