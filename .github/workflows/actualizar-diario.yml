name: Actualizar contratos diariamente

# Diseño (ver INFORME_NOCHE.md 2026-07-25 y 2026-07-27): los endpoints
# /actualizar-todos y /actualizar-fondos-ue son fire-and-forget (devuelven
# job_id al instante y procesan en segundo plano durante horas). Este
# workflow hace polling de /api/job/<id> cada 4 min (ese propio tráfico
# mantiene el contenedor despierto) hasta que el job termina; solo entonces
# descarga el cache.db de producción (/admin/cache-db, con ADMIN_TOKEN) y,
# si un chequeo "canario" de conteos confirma que no hubo colapso, lo
# commitea versionado con Git LFS. Así los datos sobreviven a los reinicios
# del contenedor (que revierten cache.db en caliente al último commit).
#
# SPLIT POR PROVINCIA (añadido 2026-08-13/14 — ver memoria del proyecto):
# hasta el 2026-08-04 este cron llamaba a /actualizar-todos?provincia=todas
# cubriendo solo Murcia+Girona (285 municipios) y funcionaba de forma
# fiable (ej. run 30906403403, 2026-08-04, 1h36m, éxito). El 2026-08-04/05
# se amplió la cobertura a Lleida+Barcelona+Tarragona (commit 0856c90),
# con lo que "todas" pasó a cubrir 5 provincias (~1006 municipios). Desde
# entonces el cron falla noche tras noche con "All jobs have failed": el
# job "todos" pasa a running y a los 4 minutos ya da 'not_found' (ver run
# 31670360515, 2026-08-13: 05:28:13 running -> 05:32:13 not_found) --
# el contenedor de Render (plan Standard, 2GB RAM) se reinicia por OOM casi
# nada más arrancar el lote completo, muy lejos de terminar los 1006
# municipios. Los fixes de checkpointing (ver más abajo) ya evitan que ese
# reinicio destruya el progreso que hubiera en disco, pero no evitan el
# OOM en sí ni permiten completar el refresco diario real de las 5
# provincias.
#
# Solución: en vez de un único disparo `provincia=todas`, este workflow
# dispara /actualizar-todos con una ÚNICA provincia cada vez (nunca más
# "todas" desde el cron), una franja horaria distinta por provincia,
# escalonadas a lo largo de la noche para que cada ejecución tenga el
# contenedor para ella sola:
#
#   01:00 UTC  murcia      (45 municipios)  + Hacienda + Población (INE)
#   02:30 UTC  girona      (240 municipios)  + contractes menors Girona (RPC)
#   04:30 UTC  lleida      (231 municipios)  + contractes menors Lleida (RPC)
#   06:30 UTC  barcelona   (309 municipios, la más grande) + contractes
#                                              menors Barcelona (RPC)
#   08:30 UTC  tarragona   (181 municipios)  + contractes menors Tarragona
#                                              (RPC) + fondos UE + noticias UE
#                                              + contratos menores Fuente Álamo
#
# Los huecos (1h30-2h) son deliberadamente generosos: con Murcia+Girona
# (285 municipios) tardando ~1h en total cuando funcionaba bien, cada
# provincia por separado (máximo 309, Barcelona) debería tardar bien menos
# que eso. Si aun así una ejecución se alarga más de la cuenta, el bloque
# `concurrency` de abajo hace que la siguiente ejecución programada quede
# en cola en vez de solaparse (y aunque llegara a solaparse, el lock
# `_actualizando_todos_lock` del backend ya impide dos /actualizar-todos
# concurrentes: el segundo simplemente falla rápido con "Ya hay un
# refresco completo en curso").
#
# Los pasos de Hacienda y Población (independientes de /actualizar-todos,
# no tocan contratos) se quedan anclados a la franja de Murcia, la primera
# de la noche, para que corran solo una vez al día y no cinco -- van AL
# FINAL de esa franja, después del refresco de contratos, ver nota
# "REORDENADO HACIENDA/POBLACIÓN" más abajo. Fondos UE +
# noticias + Fuente Álamo se quedan anclados a la última franja (Tarragona)
# por el mismo motivo, y porque ya se sabe por los logs (run 31670360515)
# que esos tres completan bien incluso en las noches en que "todos"
# revienta -- no son la causa del OOM ni se benefician de tener su propia
# franja aparte.
#
# CONTRACTES MENORS RPC POR PROVINCIA (añadido 2026-08-15, ver memoria del
# proyecto -- investigación de "contratos que faltan"): antes de este
# commit el dataset RPC (hb6v-jcbf, contractes 'Menor' de la Generalitat)
# solo se refrescaba para Girona. Verificado en vivo contra la API pública:
# 1.107 contractes reales en Lleida capital, 29.074 en Barcelona capital y
# 19.178 en Tarragona capital (todo 2021+) que nunca llegaban a la app --
# Lleida tenía el endpoint construido como fase piloto sin sumar nunca al
# cron, Barcelona/Tarragona ni siquiera tenían endpoint. Como es una
# consulta filtrada por municipio contra una API pública (no un ZIP pesado
# como PLACE), se dispara en la MISMA franja que los contratos de esa
# provincia, justo después -- no hace falta una franja propia.
#
# CHECKPOINTING (añadido 2026-08-07, ver INFORME_NOCHE.md / memoria del
# proyecto): confirmado en el dashboard de Render que el disco SÍ es
# persistente (/var/data, plan Standard, 2GB) y que cada municipio se guarda
# en cache.db en cuanto termina de procesarse (_db_set_municipio, aditivo,
# nunca borra lo ya guardado) -- un OOM que reinicia el contenedor a mitad
# de un /actualizar-todos NO borra el progreso ya hecho, solo impide que
# ESTE workflow, tal y como estaba, llegara a descargarlo y commitearlo.
# Fix: los fallos de "todos"/"fondos"/etc. ahora son blandos (marcan
# `fallo=1` pero NO abortan el step), así que el paso de descarga y el de
# canario+commit se intentan SIEMPRE -- capturando lo que haya en el disco
# en ese momento, aunque el lote no haya terminado. El canario
# (canario_cache_db.py) sigue siendo la última línea de defensa: si la
# descarga sale vacía o colapsada (<90% de lo que ya hay en el repo),
# bloquea el commit igual que antes. El job del workflow se sigue marcando
# como fallido (exit 1 al final del step principal) si `fallo=1`, para que
# César siga recibiendo el aviso por email cuando algo no termina bien --
# lo único que cambia es que ya no se tira a la basura el progreso parcial.
#
# RACE DE PUSH ENTRE FRANJAS (descubierto 2026-08-14 la primera noche que
# corrió el split de arriba): con 5 franjas empujando a `main` la misma
# noche, la franja de Tarragona (run 31788768296) hizo `git push` y lo
# recibió rechazado ("fetch first") porque el commit de cache.db de la
# franja de Barcelona (bd0e9e9) aterró en `main` unos segundos DESPUÉS del
# `checkout` de Tarragona -- el `concurrency` de abajo evita que dos
# franjas corran a la vez, pero no hay garantía de que el checkout de la
# siguiente incluya ya el push final de la anterior si la cola se libera
# justo en ese margen de segundos. Sin reintento, ese rechazo tiraba a la
# basura el cache.db recién descargado (con el progreso parcial de
# Tarragona ya checkpointeado en él). Fix: `push_con_reintento` (definida
# en cada paso que hace `git push`) reintenta con `git fetch` + `git merge
# origin/main` antes de volver a empujar, hasta 5 veces.
#
# El fix original (2026-08-14) usaba `git rebase` en vez de `merge`, bajo
# el supuesto de que para un fichero generado por el propio bot "nunca hay
# conflicto real de contenido" -- FALSO para cache.db: es un binario (Git
# LFS), y si dos franjas lo tocan cerca en el tiempo (visto en producción
# 2026-08-24, run 32711275521) el rebase revienta con CONFLICT (content)
# sin forma de auto-resolverlo, aunque ambas versiones sean snapshots
# igual de válidos de la MISMA base de datos en producción. `git merge -X
# ours` sí lo resuelve: ante conflicto en cache.db se queda automáticamente
# con nuestra copia (la recién descargada) en vez de abortar. Para
# hacienda_eell.json/poblacion.json (texto, sin -X ours) un merge normal
# sigue siendo trivial como antes, pero ahora fusiona de verdad en el caso
# raro de que sí difieran en vez de simplemente asumir que no puede pasar.
#
# REORDENADO HACIENDA/POBLACIÓN -- causa real de que SOLO la franja de
# murcia fallara cada noche (encontrado y arreglado 2026-08-18, runs
# 32091014680/31987521098/31921614417, las 3 últimas noches, mismo patrón
# exacto): no era OOM. Render tiene autoDeploy por defecto (render.yaml no
# lo desactiva) -- cualquier push a `main` redespliega el servicio entero.
# Los pasos de Hacienda y Población hacían su propio commit+push ANTES de
# llamar a /actualizar-todos (únicos 2 pasos de todo el workflow que
# pusheaban antes del refresco de contratos de su franja; las otras 4
# provincias solo pushean su cache.db al final, cuando su job ya está
# 'done'). Timeline real del run 32091014680: 02:13:18 push hacienda ->
# 02:13:27 push población -> 02:13:27 POST /actualizar-todos?provincia=
# murcia (running) -> 02:17:27 not_found (contenedor reiniciado por el
# redeploy que dispararon esos 2 pushes, justo a mitad del lote de 45
# municipios, el más pequeño de los 5 -- por eso nunca fue un problema de
# tamaño de lote). Fix: Hacienda y Población se movieron al FINAL de la
# franja de murcia (después del paso de contratos y del canario+commit),
# mismo patrón que ya usan las otras 4 provincias -- su push ahora llega
# cuando el job de contratos de esa franja ya terminó, así que el redeploy
# que dispara no puede interrumpir nada. Sus `if:` pasan a necesitar
# `!cancelled()` explícito (antes no hacía falta, al ir primero corrían
# siempre) para que sigan ejecutándose aunque el paso de contratos termine
# en `fallo=1`.

on:
  schedule:
    # Horarios UTC -- ver tabla en la nota de cabecera de más arriba. Cada
    # entrada dispara la MISMA job, que decide qué franja es mirando
    # `github.event.schedule` (paso "Determinar franja horaria" más abajo).
    - cron: "0 1 * * *"    # murcia + hacienda + población
    - cron: "30 2 * * *"   # girona
    - cron: "30 4 * * *"   # lleida
    - cron: "30 6 * * *"   # barcelona
    - cron: "30 8 * * *"   # tarragona + fondos UE + noticias UE + menors girona + fuentealamo
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      provincia:
        description: >-
          Provincia a refrescar en este disparo manual (una sola, nunca
          "todas" en el cron programado -- ver nota de cabecera sobre el
          OOM que causaba). "todas" queda disponible aquí solo para un
          catch-up manual de emergencia, asumiendo el riesgo de OOM que
          motivó dividir el cron.
        type: choice
        options:
          - murcia
          - girona
          - lleida
          - barcelona
          - tarragona
          - todas
        default: murcia
      solo_fondos_ue:
        description: >-
          Salta el refresco de contratos de la provincia elegida y lanza
          solo /actualizar-fondos-ue (+ noticias + menors girona +
          fuentealamo). Útil para probar rápido cambios en CORDIS,
          Cohesion Data o el enriquecimiento de beneficiarios (Kohesio) sin
          esperar el ciclo completo de una provincia.
        type: boolean
        default: false

# Necesario para que el paso final pueda commitear/pushear el cache.db nuevo.
permissions:
  contents: write

# Evita que dos disparos de este workflow (dos franjas horarias distintas,
# o una franja + un disparo manual) corran en paralelo: si uno se alarga
# más de la cuenta, el siguiente se pone en cola en vez de pisarle el
# refresco al de producción (que además ya tiene su propio lock interno,
# ver nota de cabecera).
concurrency:
  group: actualizar-diario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # Tope de seguridad por debajo del límite DURO de 6h (360 min) de los
    # runners hosted de GitHub. El polling interno corta antes (200 min),
    # esto es solo una red de seguridad por si algo se colgara. Bajado de
    # 350 a 220 min respecto a la versión "todas" de este workflow: ahora
    # cada ejecución cubre como mucho UNA provincia (309 municipios,
    # Barcelona, en el peor caso) en vez de las 5 a la vez.
    timeout-minutes: 220
    steps:
      - name: Determinar franja horaria (provincia) de esta ejecución
        id: slot
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            provincia="${{ github.event.inputs.provincia }}"
          else
            case "${{ github.event.schedule }}" in
              "0 1 * * *")  provincia="murcia" ;;
              "30 2 * * *") provincia="girona" ;;
              "30 4 * * *") provincia="lleida" ;;
              "30 6 * * *") provincia="barcelona" ;;
              "30 8 * * *") provincia="tarragona" ;;
              *)
                echo "::error::Cron desconocido '${{ github.event.schedule }}'; no sé qué provincia toca. Abortando por seguridad."
                exit 1
                ;;
            esac
          fi
          echo "Franja de esta ejecución: provincia=${provincia}"
          echo "provincia=${provincia}" >> "$GITHUB_OUTPUT"

      # Va DESPUÉS de "Determinar franja horaria" a propósito (ese paso no
      # necesita el repo descargado, es puro bash/expresiones de GH) --
      # 2026-09-02, cuota de Git LFS bandwidth agotada (10GB/mes). El
      # ancho de banda de LFS de GitHub SOLO cuenta descargas (pull/clone/
      # checkout), los push/commit son gratis -- así que este checkout con
      # `lfs: true`, que antes se hacía SIEMPRE (~250MB × 5 franjas/día),
      # era el consumo real dominante, no los commits. Ahora que el commit
      # de cache.db solo pasa en Tarragona (ver step "Canario anti-colapso
      # + commit condicionado" más abajo), backend/cache.db ya materializado
      # por LFS no lo usa NADA en las otras 4 franjas -- solo el script del
      # canario lo lee, y ese script tampoco corre fuera de Tarragona. Con
      # esto la descarga LFS pasa de 5 veces/día a 1.
      - name: Checkout del repo (con Git LFS para materializar cache.db solo en Tarragona)
        uses: actions/checkout@v4
        with:
          lfs: ${{ steps.slot.outputs.provincia == 'tarragona' }}

      - name: Refresco de la provincia de esta franja + keep-alive por polling + descarga del cache.db
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE_URL: https://dinero-publico.onrender.com
          PROVINCIA_SLOT: ${{ steps.slot.outputs.provincia }}
          SOLO_FONDOS_UE: ${{ github.event.inputs.solo_fondos_ue || 'false' }}
        run: |
          set -uo pipefail

          # --- helpers (python3 en una sola línea: si el cuerpo no es JSON
          #     válido, json.load lanza, python sale != 0 y el `|| echo` da el
          #     valor por defecto -- así nunca aborta el paso) -----------------
          get_jobid() {   # job_id de una respuesta JSON, o '' si no hay
            printf '%s' "$1" | python3 -c "import sys,json;print(json.load(sys.stdin).get('job_id',''))" 2>/dev/null || echo ''
          }
          get_status() {  # status de un job, o 'not_found' ante cualquier fallo
            curl -s --max-time 30 "${BASE_URL}/api/job/$1" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','not_found'))" 2>/dev/null || echo not_found
          }
          get_error() {   # campo 'error' de un job (motivo corto, ej. lock de
            # /actualizar-todos ya ocupado) -- distinto de 'log', que en un
            # rechazo por lock viene vacío y no explica nada por sí solo
            curl -s --max-time 30 "${BASE_URL}/api/job/$1" | python3 -c "import sys,json;print(json.load(sys.stdin).get('error') or '(sin detalle)')" 2>/dev/null || echo '(sin detalle)'
          }
          mostrar_log() {  # imprime el log del job (vive solo en memoria del
            # contenedor -- se pierde en el próximo reinicio, así que hay que
            # volcarlo aquí en cuanto el job termina, no se puede recuperar después)
            curl -s --max-time 30 "${BASE_URL}/api/job/$1" | \
              python3 -c "import sys,json; print('\n'.join(json.load(sys.stdin).get('log', [])))" 2>/dev/null || true
          }

          MAX_MIN=200           # presupuesto TOTAL de este paso, por debajo del límite duro de 220 min del job
          INTERVAL=240          # 4 min < los ~15 min que Render tarda en dormirse
          deadline=$(( $(date +%s) + MAX_MIN * 60 ))
          fallo=0               # se pone a 1 si algún refresco crítico de esta franja no
                                 # llega a 'done' -- no aborta el step (ver nota de
                                 # checkpointing arriba), solo hace que el step termine en
                                 # exit 1 al final, DESPUÉS de intentar igualmente la
                                 # descarga+commit del progreso parcial.

          # Espera a que un job_id llegue a 'done'. Aborta (return 1) si el job
          # da 'error', si 'not_found' persiste 3 ciclos seguidos (el
          # contenedor se reinició y perdió el estado en memoria), o si se
          # agota el presupuesto total. Mientras tanto imprime cada ciclo, y
          # ese propio tráfico de polling es el keep-alive.
          poll_hasta_done() {
            local job_id="$1" etiqueta="$2" notfound=0 st
            while true; do
              st=$(get_status "$job_id")
              echo "$(date -u +%H:%M:%S)Z  ${etiqueta}=${st}"

              if [ "$st" = "error" ]; then
                echo "::error::${etiqueta} terminó en 'error'. No se commitea."
                echo "  motivo: $(get_error "$job_id")"
                echo "--- log de ${etiqueta} ---"
                mostrar_log "$job_id"
                return 1
              fi
              if [ "$st" = "done" ]; then
                echo "--- log de ${etiqueta} ---"
                mostrar_log "$job_id"
                return 0
              fi

              if [ "$st" = "not_found" ]; then
                notfound=$(( notfound + 1 ))
              else
                notfound=0
              fi
              if [ "$notfound" -ge 3 ]; then
                echo "::error::${etiqueta}: job_id no encontrado 3 ciclos seguidos: el contenedor se reinició a mitad del lote y perdió el estado en memoria. Aborto sin commitear."
                return 1
              fi

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Timeout de ${MAX_MIN} min sin completar ${etiqueta} (status=$st). Aborto sin commitear."
                return 1
              fi
              sleep "$INTERVAL"
            done
          }

          # --- 1. Contratos de la provincia de esta franja (nunca "todas" --
          #     ver nota de cabecera sobre el OOM que causaba) --------------
          # SOLO_FONDOS_UE=true (input manual) se salta esta etapa entera --
          # solo para pruebas rápidas, el cron programado nunca lo activa.
          if [ "$SOLO_FONDOS_UE" = "true" ]; then
            echo "== SOLO_FONDOS_UE=true: saltando /actualizar-todos =="
          else
            echo "== Disparando /actualizar-todos (provincia=${PROVINCIA_SLOT}) =="
            resp_todos=$(curl -s --max-time 60 -X POST \
              -d "token=${ADMIN_TOKEN}" -d "provincia=${PROVINCIA_SLOT}" \
              "${BASE_URL}/actualizar-todos" || true)
            echo "respuesta: $resp_todos"
            job_todos=$(get_jobid "$resp_todos")
            if [ -z "$job_todos" ]; then
              echo "::error::No se obtuvo job_id de /actualizar-todos. ¿ADMIN_TOKEN mal configurado (403) o app caída?"
              fallo=1
            else
              echo "job_todos=$job_todos"
              if poll_hasta_done "$job_todos" "todos-${PROVINCIA_SLOT}"; then
                echo "Contratos de ${PROVINCIA_SLOT} completados ('done')."
              else
                echo "::warning::Refresco de contratos de ${PROVINCIA_SLOT} no completó. Se sigue igualmente para checkpointear el progreso parcial que ya haya en el disco."
                fallo=1
              fi
            fi
          fi

          # --- 1.5. Contractes menors (RPC) de la MISMA provincia de esta
          #     franja -- Girona, Lleida, Barcelona y Tarragona (Murcia no:
          #     sus contratos menores vienen de Lorca/Mula/Molina de Segura/
          #     Fuente Álamo, fuentes propias sin API RPC, ver sección 2 más
          #     abajo). Añadido 2026-08-15 al investigar contratos que
          #     faltaban en la app: el dataset RPC (hb6v-jcbf) tenía
          #     contractes 'Menor' reales para las 4 provincias catalanas
          #     (verificado en vivo: 1.107 en Lleida capital, 29.074 en
          #     Barcelona capital, 19.178 en Tarragona capital, solo 2021+)
          #     pero antes de este commit únicamente se refrescaba Girona
          #     (Lleida tenía el endpoint construido como fase piloto sin
          #     sumar nunca al cron; Barcelona/Tarragona ni siquiera tenían
          #     endpoint). Va DESPUÉS de los contratos de la franja pero en
          #     el mismo paso/franja horaria -- no merece una franja propia,
          #     es una única consulta filtrada por municipio contra la API
          #     pública de la Generalitat, no un ZIP pesado como PLACE.
          if [ "$SOLO_FONDOS_UE" = "true" ]; then
            echo "== SOLO_FONDOS_UE=true: saltando contractes menors (RPC) =="
          elif [ "$PROVINCIA_SLOT" = "murcia" ]; then
            echo "== Franja murcia: RPC no aplica (fuentes propias de Murcia van en la franja de Tarragona) =="
          else
            echo "== Disparando /actualizar-contratos-menors-${PROVINCIA_SLOT} (RPC) =="
            resp_menors=$(curl -s --max-time 60 -X POST \
              -d "token=${ADMIN_TOKEN}" \
              "${BASE_URL}/actualizar-contratos-menors-${PROVINCIA_SLOT}" || true)
            echo "respuesta: $resp_menors"
            job_menors=$(get_jobid "$resp_menors")
            if [ -z "$job_menors" ]; then
              echo "::warning::No se obtuvo job_id de /actualizar-contratos-menors-${PROVINCIA_SLOT}. Se continúa sin refrescar hoy."
            else
              echo "job_menors=$job_menors"
              poll_hasta_done "$job_menors" "menors-${PROVINCIA_SLOT}" || echo "::warning::Contractes menors de ${PROVINCIA_SLOT} no completados; se continúa igualmente."
            fi

            # --- 1.6. Gerentes/administradores de los contractes menors RPC
            #     de ESTA MISMA franja -- justo después de refrescarlos
            #     (arriba), en vez de esperar a que las 4 provincias
            #     catalanas + Murcia compitan por un único presupuesto de
            #     30 min/noche anclado a Tarragona (ver sección 2.3 más
            #     abajo, causa original de que a ~1.250 filas/noche el
            #     backlog nacional de 75k+ tardara ~60 noches en vaciarse).
            #     El endpoint sigue sin filtrar por provincia -- no filtra
            #     por columna `provincia`, procesa toda la tabla
            #     `contratos_menors_locales` -- pero eso no duplica trabajo:
            #     la caché persistente de la tabla `directores`
            #     (_dir_cache_get/_dir_cache_agotado) hace que lo ya resuelto
            #     por una franja anterior esta misma noche se salte solo. Al
            #     dispararlo aquí, cada franja catalana se lleva su propio
            #     presupuesto de 30 min en vez de competir con las otras. No
            #     bloquea el commit del día si falla.
            echo "== Disparando /actualizar-directivos-contratos-menores (franja ${PROVINCIA_SLOT}) =="
            resp_dcm_franja=$(curl -s --max-time 60 -X POST \
              -d "token=${ADMIN_TOKEN}" \
              "${BASE_URL}/actualizar-directivos-contratos-menores" || true)
            echo "respuesta: $resp_dcm_franja"
            job_dcm_franja=$(get_jobid "$resp_dcm_franja")
            if [ -z "$job_dcm_franja" ]; then
              echo "::warning::No se obtuvo job_id de /actualizar-directivos-contratos-menores (franja ${PROVINCIA_SLOT}). Se continúa sin refrescar hoy."
            else
              echo "job_dcm_franja=$job_dcm_franja"
              poll_hasta_done "$job_dcm_franja" "directivos-menores-${PROVINCIA_SLOT}" || echo "::warning::Directivos de contratos menores (franja ${PROVINCIA_SLOT}) no completado; se continúa igualmente."
            fi
          fi

          # --- 2. Extras de fin de noche: fondos UE, noticias UE y Fuente
          #     Álamo -- SOLO en la última franja (Tarragona) para que
          #     corran una vez al día, no cinco. Se saltan por completo en
          #     las demás franjas. `solo_fondos_ue` manual los fuerza
          #     también fuera de la franja de Tarragona, para poder
          #     probarlos sueltos sin esperar al ciclo completo. --
          if [ "$PROVINCIA_SLOT" != "tarragona" ] && [ "$SOLO_FONDOS_UE" != "true" ]; then
            echo "== Franja ${PROVINCIA_SLOT}: se saltan fondos UE/noticias/fuentealamo (van con la franja de Tarragona) =="
          else
            echo "== Disparando /actualizar-fondos-ue (CORDIS + Cohesion Data) =="
            resp_fue=$(curl -s --max-time 60 -X POST \
              -d "token=${ADMIN_TOKEN}" \
              "${BASE_URL}/actualizar-fondos-ue" || true)
            echo "respuesta: $resp_fue"
            job_fue=$(get_jobid "$resp_fue")
            if [ -z "$job_fue" ]; then
              echo "::error::No se obtuvo job_id de /actualizar-fondos-ue. ¿ADMIN_TOKEN mal configurado (403) o app caída?"
              fallo=1
            else
              echo "job_fue=$job_fue"
              if poll_hasta_done "$job_fue" "fondos"; then
                echo "Fondos UE completados ('done')."
              else
                echo "::warning::Refresco de fondos UE no completó. Se sigue igualmente para checkpointear el progreso parcial que ya haya en el disco."
                fallo=1
              fi
            fi

            # --- 2.1. Noticias UE (RSS Press Corner) ---------------------------
            # Descarga rápida (un solo GET del RSS, sin ZIPs). Si este paso
            # falla, NO aborta el workflow entero: un fallo puntual del RSS de
            # la Comisión Europea no debe bloquear el commit de contratos/
            # fondos UE, que sí se completaron bien.
            echo "== Disparando /actualizar-noticias-ue (RSS Press Corner) =="
            resp_noticias=$(curl -s --max-time 60 -X POST \
              -d "token=${ADMIN_TOKEN}" \
              "${BASE_URL}/actualizar-noticias-ue" || true)
            echo "respuesta: $resp_noticias"
            job_noticias=$(get_jobid "$resp_noticias")
            if [ -z "$job_noticias" ]; then
              echo "::warning::No se obtuvo job_id de /actualizar-noticias-ue. Se continúa sin noticias UE frescas hoy."
            else
              echo "job_noticias=$job_noticias"
              poll_hasta_done "$job_noticias" "noticias" || echo "::warning::Noticias UE no completadas; se continúa igualmente."
            fi

            # --- 2.2. Contratos menores Fuente Álamo de Murcia (portal propio) -
            # Refresca contratos_menors_locales con las filas de Fuente Álamo
            # (scraping de CSV, sin dependencias nuevas). No bloquea el commit
            # del día si falla.
            echo "== Disparando /actualizar-contratos-menores-fuentealamo =="
            resp_fa=$(curl -s --max-time 60 -X POST \
              -d "token=${ADMIN_TOKEN}" \
              "${BASE_URL}/actualizar-contratos-menores-fuentealamo" || true)
            echo "respuesta: $resp_fa"
            job_fa=$(get_jobid "$resp_fa")
            if [ -z "$job_fa" ]; then
              echo "::warning::No se obtuvo job_id de /actualizar-contratos-menores-fuentealamo. Se continúa sin refrescar hoy."
            else
              echo "job_fa=$job_fa"
              poll_hasta_done "$job_fa" "fuentealamo" || echo "::warning::Fuente Álamo no completado; se continúa igualmente."
            fi

            # --- 2.3. Gerentes/administradores de contratos menores restantes
            #     (Murcia + cualquier resto) -------------------------------
            # Las 4 provincias catalanas (Girona/Lleida/Barcelona/Tarragona)
            # ya se llevan su propio pase justo después de refrescar sus
            # contractes menors RPC (sección 1.6, dentro de su propia franja)
            # -- este llamado, anclado a la franja de Tarragona junto con
            # fondos UE/noticias/Fuente Álamo, procesa lo que quede: sobre
            # todo los contratos menores propios de Murcia (Fuente Álamo,
            # Lorca/Lorquí/Mula/Molina de Segura, sin fuente RPC propia) más
            # cualquier fila residual que las pasadas de la sección 1.6 no
            # llegaran a cubrir en su presupuesto de 30 min. El endpoint
            # sigue sin filtrar por provincia (ver sección 1.6), así que
            # también vuelve a mirar Girona/Lleida/Barcelona/Tarragona en la
            # misma noche -- inofensivo, la caché persistente de `directores`
            # hace que lo ya resuelto se salte solo. No bloquea el commit del
            # día si falla.
            echo "== Disparando /actualizar-directivos-contratos-menores =="
            resp_dcm=$(curl -s --max-time 60 -X POST \
              -d "token=${ADMIN_TOKEN}" \
              "${BASE_URL}/actualizar-directivos-contratos-menores" || true)
            echo "respuesta: $resp_dcm"
            job_dcm=$(get_jobid "$resp_dcm")
            if [ -z "$job_dcm" ]; then
              echo "::warning::No se obtuvo job_id de /actualizar-directivos-contratos-menores. Se continúa sin refrescar hoy."
            else
              echo "job_dcm=$job_dcm"
              poll_hasta_done "$job_dcm" "directivos-menores" || echo "::warning::Directivos de contratos menores no completado; se continúa igualmente."
            fi
          fi

          # --- 3. descargar el cache.db de producción ------------------------
          # Se intenta SIEMPRE, incluso si algo de lo anterior no llegó a
          # 'done' (checkpointing, ver nota de cabecera del workflow): el
          # disco persistente ya tiene lo que se haya procesado hasta el
          # momento del reinicio, aditivo por municipio -- mejor commitear eso
          # que nada. El canario del step siguiente decide si de verdad es
          # seguro commitearlo.
          echo "== Descargando cache.db de producción =="
          http=$(curl -s --max-time 300 -w "%{http_code}" \
            -o cache_db_nuevo.db \
            "${BASE_URL}/admin/cache-db?token=${ADMIN_TOKEN}" || echo 000)
          if [ "$http" != "200" ]; then
            echo "::error::/admin/cache-db devolvió HTTP $http."
            fallo=1
          else
            echo "Descargado cache_db_nuevo.db ($(stat -c%s cache_db_nuevo.db) bytes)."
          fi

          if [ "$fallo" -ne 0 ]; then
            echo "::error::Uno o más refrescos críticos de esta franja (${PROVINCIA_SLOT}) no se completaron hoy. El job se marca como fallido para que llegue el aviso por email, pero se intenta igualmente checkpointear cualquier progreso parcial en el siguiente paso."
          fi
          exit "$fallo"

      - name: Canario anti-colapso + commit condicionado (Git LFS)
        # !cancelled() (no always()): se ejecuta tanto si el step anterior
        # terminó bien como si terminó en `fallo=1` (checkpointing de
        # progreso parcial, ver nota de cabecera del workflow) -- pero NO si
        # el propio workflow fue cancelado a mano, para no commitear a medias
        # de una cancelación deliberada.
        #
        # SOLO en la franja de Tarragona (2026-09-02, cuota de Git LFS
        # bandwidth agotada -- 10GB/mes, y este commit de ~250MB se hacía
        # hasta 5 veces/día, una por franja, disparando el bloqueo de LFS
        # que rompía el build de Render con "git lfs pull" fallando). El
        # commit a git de cache.db es puramente un backup/auditoría: la app
        # sirve siempre desde el disco persistente de Render (DB_FILE,
        # ver backend/app.py), que cada franja escribe igual que antes --
        # nada de esto depende de que este step llegue a correr. El
        # sembrado automático desde el cache.db del repo está además
        # explícitamente deshabilitado desde el incidente de 2026-08-08
        # (ver comentario "REDISEÑO 2026-08-08" en backend/app.py): nunca
        # se copia solo al arrancar, así que reducir la frecuencia de este
        # commit no cambia en nada el comportamiento de arranque. Efecto
        # secundario bueno: al pasar de hasta 5 pushes/redeploys de Render
        # al día a 1, también baja el riesgo del patrón de "redeploy mata
        # el job de la siguiente franja ~12 min después" visto varias
        # noches seguidas.
        if: ${{ !cancelled() && steps.slot.outputs.provincia == 'tarragona' }}
        run: |
          set -uo pipefail
          if [ ! -f cache_db_nuevo.db ]; then
            echo "No se llegó a descargar cache_db_nuevo.db (fallo antes de ese paso). Nada que commitear."
            exit 0
          fi
          # El canario compara conteos (contratos + filas de fondos_ue) del
          # cache.db del repo vs el descargado; sale != 0 si el nuevo cae por
          # debajo del 90% en cualquiera (colapso silencioso -> mejor no tocar).
          python3 .github/scripts/canario_cache_db.py backend/cache.db cache_db_nuevo.db | tee canario.out
          codigo=${PIPESTATUS[0]}
          if [ "$codigo" -ne 0 ]; then
            echo "El canario bloqueó el commit (ver ::error:: arriba). Termino sin tocar el repo."
            exit 1
          fi
          conteos=$(grep '^RESUMEN' canario.out | sed 's/^RESUMEN //')
          rm -f canario.out

          # Reintenta el push con merge si otra franja ya empujó a main
          # mientras tanto -- ver nota "RACE DE PUSH ENTRE FRANJAS" de cabecera
          # (así es exactamente como se perdió el checkpoint de Tarragona la
          # primera noche: Barcelona commiteó unos segundos después de que
          # este job hiciera su checkout).
          #
          # Antes usaba `git rebase`, pero cache.db es un binario (Git LFS):
          # un rebase reaplica nuestro commit como un parche sobre
          # origin/main y git no sabe fusionar dos versiones de un binario
          # -- revienta con CONFLICT (content) en CUALQUIER noche en que dos
          # franjas toquen cache.db cerca en el tiempo, aunque las dos sean
          # snapshots igual de válidos de la MISMA base de datos en
          # producción (visto en producción 2026-08-24, run 32711275521).
          # `git merge -X ours` sí resuelve esto: si cache.db conflictúa, se
          # queda automáticamente con NUESTRA copia (la que acabamos de
          # descargar de producción, la más fresca) en vez de abortar --
          # nunca hace falta resolver un binario a mano.
          push_con_reintento() {
            local intentos=0
            while true; do
              if git push; then
                return 0
              fi
              intentos=$((intentos+1))
              if [ "$intentos" -ge 5 ]; then
                echo "::error::git push falló tras $intentos intentos (main avanzó más rápido de lo que podíamos alcanzar)."
                return 1
              fi
              echo "push rechazado (probablemente otra franja commiteó primero) -- reintento $intentos/5 tras merge con origin/main..."
              git fetch origin main
              # Guarda cualquier cambio suelto sin commitear antes de
              # mergear -- mismo motivo que antes con rebase: algo deja el
              # working tree con cambios sin stagear entre el commit y el
              # push, probablemente normalización de line-endings vía
              # .gitattributes/LFS al tocar main (visto en producción
              # 2026-08-15). `git stash push -u` no hace nada si no hay
              # cambios que guardar, así que este paso es inofensivo también
              # cuando el árbol ya estaba limpio.
              git stash push -u -m "push_con_reintento: cambios sueltos antes de mergear" >/dev/null 2>&1 || true
              if ! git merge --no-edit -X ours origin/main; then
                echo "::error::git merge con origin/main falló; abortando push."
                git merge --abort 2>/dev/null || true
                git stash pop >/dev/null 2>&1 || true
                return 1
              fi
              git stash pop >/dev/null 2>&1 || true
              sleep 5
            done
          }

          mv -f cache_db_nuevo.db backend/cache.db
          git config user.name  "dinero-publico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/cache.db
          if git diff --cached --quiet; then
            echo "cache.db idéntico al del repo; nada que commitear."
            exit 0
          fi
          git commit -m "Auto-commit diario de cache.db desde producción (${conteos}) [franja: ${{ steps.slot.outputs.provincia }}]"
          push_con_reintento
          echo "cache.db commiteado y pusheado (${conteos})."

      - name: Refrescar deuda viva y saldo no financiero (Ministerio de Hacienda)
        # !cancelled() (no éxito implícito): tiene que seguir corriendo aunque
        # el paso de contratos de esta franja haya fallado -- ver nota
        # "REORDENADO HACIENDA/POBLACIÓN" de cabecera (2026-08-18): antes este
        # paso iba ANTES del refresco de contratos y su push a main disparaba
        # un redeploy de Render que mataba el job de contratos de murcia a
        # mitad. Ahora va al final de la franja a propósito, para que su push
        # (y el redeploy que dispara) no pueda interrumpir nada.
        if: ${{ !cancelled() && steps.slot.outputs.provincia == 'murcia' }}
        run: |
          set -uo pipefail
          # Independiente del resto del workflow: no depende de la app en
          # producción (a diferencia del paso de contratos de arriba, que
          # habla con ${BASE_URL} vía ADMIN_TOKEN) -- descarga directo de
          # hacienda.gob.es y escribe un JSON estático versionado, mismo
          # patrón que cuentas_anuales.json/retribuciones_ispa.json (ver
          # actualizar_deuda_y_liquidaciones.py). Anclado a la franja de
          # Murcia para que corra una sola vez al día, no una vez por cada
          # una de las 5 franjas.
          # Cada `|| exit 0` es a propósito: un fallo aquí (Hacienda cambia
          # el formato de su página índice, host caído, etc.) no debe
          # bloquear nada más -- mismo criterio que noticias UE / contractes
          # menors de más arriba.
          pip install --quiet -r requirements.txt openpyxl \
            || { echo "::warning::No se pudieron instalar dependencias para el refresco de Hacienda; se salta."; exit 0; }
          (cd backend && python actualizar_deuda_y_liquidaciones.py) \
            || { echo "::warning::actualizar_deuda_y_liquidaciones.py falló; se mantiene el hacienda_eell.json existente."; exit 0; }

          # Reintenta el push con merge si otra franja ya empujó a main
          # mientras tanto -- ver nota "RACE DE PUSH ENTRE FRANJAS" de
          # cabecera. Antes usaba `git rebase`; ver el comentario largo en el
          # push_con_reintento() del paso de cache.db más arriba sobre por
          # qué eso reventaba con binarios LFS -- aquí el archivo es JSON de
          # texto, así que un merge normal (sin -X ours) puede fusionar de
          # verdad los cambios de ambos lados en vez de descartar uno.
          push_con_reintento() {
            local intentos=0
            while true; do
              if git push; then
                return 0
              fi
              intentos=$((intentos+1))
              if [ "$intentos" -ge 5 ]; then
                echo "::error::git push falló tras $intentos intentos (main avanzó más rápido de lo que podíamos alcanzar)."
                return 1
              fi
              echo "push rechazado (probablemente otra franja commiteó primero) -- reintento $intentos/5 tras merge con origin/main..."
              git fetch origin main
              # Guarda cualquier cambio suelto sin commitear antes de
              # mergear -- mismo motivo que antes con rebase: algo deja el
              # working tree con cambios sin stagear entre el commit y el
              # push, probablemente normalización de line-endings vía
              # .gitattributes/LFS al tocar main (visto en producción
              # 2026-08-15). `git stash push -u` no hace nada si no hay
              # cambios que guardar, así que este paso es inofensivo también
              # cuando el árbol ya estaba limpio.
              git stash push -u -m "push_con_reintento: cambios sueltos antes de mergear" >/dev/null 2>&1 || true
              if ! git merge --no-edit origin/main; then
                echo "::error::git merge con origin/main falló; abortando push."
                git merge --abort 2>/dev/null || true
                git stash pop >/dev/null 2>&1 || true
                return 1
              fi
              git stash pop >/dev/null 2>&1 || true
              sleep 5
            done
          }

          git config user.name  "dinero-publico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/hacienda_eell.json
          if git diff --cached --quiet; then
            echo "hacienda_eell.json sin cambios; nada que commitear."
          else
            git commit -m "Auto-commit: refresco deuda viva y saldo no financiero (Ministerio de Hacienda)"
            push_con_reintento
            echo "hacienda_eell.json commiteado y pusheado."
          fi

      - name: Refrescar población oficial (INE, Padrón Municipal)
        # !cancelled(): mismo motivo que el paso de Hacienda de arriba.
        if: ${{ !cancelled() && steps.slot.outputs.provincia == 'murcia' }}
        run: |
          set -uo pipefail
          # Mismo criterio que el paso de Hacienda de arriba: independiente
          # del resto (no habla con la app en producción), fuente propia
          # (API JSON del INE, ver actualizar_poblacion.py), anclado a la
          # franja de Murcia para correr una sola vez al día -- solo usa
          # 'requests', ya en requirements.txt, no hace falta openpyxl aquí.
          pip install --quiet -r requirements.txt \
