              fi
              intentos=$((intentos+1))
              if [ "$intentos" -ge 5 ]; then
                echo "::error::git push falló tras $intentos intentos (main avanzó más rápido de lo que podíamos alcanzar)."
                return 1
              fi
              echo "push rechazado (probablemente otra franja commiteó primero) -- reintento $intentos/5 tras merge con origin/main..."
              git fetch origin main
              # Guarda cualquier cambio suelto sin commitear antes de
              # mergear -- mismo motivo que antes con rebase: algo deja el
              # working tree con cambios sin stagear entre el commit y el
              # push, probablemente normalización de line-endings vía
              # .gitattributes/LFS al tocar main (visto en producción
              # 2026-08-15). `git stash push -u` no hace nada si no hay
              # cambios que guardar, así que este paso es inofensivo también
              # cuando el árbol ya estaba limpio.
              git stash push -u -m "push_con_reintento: cambios sueltos antes de mergear" >/dev/null 2>&1 || true
              if ! git merge --no-edit origin/main; then
                echo "::error::git merge con origin/main falló; abortando push."
                git merge --abort 2>/dev/null || true
                git stash pop >/dev/null 2>&1 || true
                return 1
              fi
              git stash pop >/dev/null 2>&1 || true
              sleep 5
            done
          }

          git config user.name  "dinero-publico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/poblacion.json
          if git diff --cached --quiet; then
            echo "poblacion.json sin cambios; nada que commitear."
          else
            git commit -m "Auto-commit: refresco población oficial (INE, Padrón Municipal)"
            push_con_reintento
            echo "poblacion.json commiteado y pusheado."
          fi
