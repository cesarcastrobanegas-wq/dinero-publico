name: Fechas de adjudicación de los formales de PLACE (una vez)

# Genera el fichero de correcciones fechas_formales_place.json.gz: la fecha de adjudicación de los contratos formales
# de PLACE que están guardados en producción sin ella (el analizador no la guardaba hasta el 2026-10-10). Solo se
# lanza a mano. No toca producción: baja la base solo para saber qué licitaciones no tienen fecha, lee los ZIP
# mensuales de PLACE y deja el resultado como artefacto. El fichero lleva únicamente identificadores de licitación y
# fechas (ningún dato personal); la web lo aplica al arrancar cuando se sube al repositorio.

on:
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama con el generador"
        default: "main"
      desde:
        description: "Mes más reciente (AAAAMM)"
        default: "202610"
      hasta:
        description: "Mes más antiguo (AAAAMM)"
        default: "202109"

permissions:
  contents: read

concurrency:
  group: fechas-formales-place
  cancel-in-progress: false

jobs:
  fechas:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests

      - name: Base de producción (descarga reanudable, solo lectura)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for i in $(seq 1 15); do
            if curl -sS --fail -C - -o cache.db "https://dinero-publico.com/admin/cache-db?token=${ADMIN_TOKEN}"; then
              break
            fi
            echo "Corte en el intento ${i}, reanudando en 15 s..."
            sleep 15
          done
          resultado=$(python -c "import sqlite3; print(sqlite3.connect('cache.db').execute('PRAGMA integrity_check').fetchone()[0])")
          echo "cache.db: $(stat -c%s cache.db) bytes, integrity_check=${resultado}"
          [ "$resultado" = "ok" ] || { echo "::error::cache.db no válido."; exit 1; }

      - name: Leer los ZIP mensuales de PLACE
        run: |
          cd backend
          python generar_fechas_formales_place.py "${{ inputs.desde }}" "${{ inputs.hasta }}" \
            --cache ../cache.db --salida fechas_formales_place.json.gz
          rm -f ../cache.db

      - name: Fichero de fechas (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fechas-formales-place
          path: backend/fechas_formales_place.json.gz
          if-no-files-found: warn
          retention-days: 7
